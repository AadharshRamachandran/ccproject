apiVersion: apps/v1
kind: Deployment
metadata: {name: hybrid-controller, namespace: hybrid-autoscaling}
spec:
  replicas: 1
  selector: {matchLabels: {app: hybrid-controller}}
  template:
    metadata: {labels: {app: hybrid-controller}}
    spec:
      serviceAccountName: hybrid-controller
      containers:
        - name: controller
          image: hybrid-controller:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - {name: APPLY_CHANGES, value: 'true'}
            - {name: NAMESPACE, value: hybrid-autoscaling}
            - {name: DEPLOYMENT, value: house-price}
            - {name: PROMETHEUS_URL, value: 'http://kube-prometheus-stack-prometheus.monitoring.svc:9090'}
            # EXECUTION_BACKEND=rolling: new Deployments get a unique cpu-gen
            # label added to their selector so they never overlap with the old
            # Deployment's selector (Kubernetes requirement for stable ownership).
            - {name: EXECUTION_BACKEND, value: rolling}
            - {name: ADAPTIVE_MONITORING, value: 'false'}
            # Explicit model paths relative to WORKDIR /app.
            # Dockerfile symlinks Paper/models -> /app/models, but setting these
            # explicitly avoids a crash-loop if the symlink is ever missing.
            - {name: FORECAST_MODEL,    value: Paper/models/bilstm.pt}
            - {name: PERFORMANCE_MODEL, value: Paper/models/performance.joblib}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: hybrid-controller, namespace: hybrid-autoscaling}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: hybrid-controller, namespace: hybrid-autoscaling}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments","deployments/scale"]
    verbs: ["get","create","patch","delete"]
  - apiGroups: [""]
    resources: ["pods","pods/resize"]
    verbs: ["get","list","patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: hybrid-controller, namespace: hybrid-autoscaling}
subjects: [{kind: ServiceAccount, name: hybrid-controller, namespace: hybrid-autoscaling}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: hybrid-controller}
